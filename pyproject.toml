[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencloud-quiet-backup"
version = "0.1.0"
description = "OpenCloud Quiet Backup — backups coherentes de OpenCloud en Docker"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
opencloud-quiet-backup = "opencloud_backup.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["opencloud_backup"]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RET", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["opencloud_backup"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
